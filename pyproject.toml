[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-reimplementation"
version = "0.1.0"
description = "Controlled larger-local-model study of DeepSeek-inspired MLA, MoE routing, and multi-token prediction under constrained compute."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Marko Miovski" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_reimpl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.mypy]
python_version = "3.10"
packages = ["deepseek_reimpl"]
ignore_missing_imports = true
strict = false
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
