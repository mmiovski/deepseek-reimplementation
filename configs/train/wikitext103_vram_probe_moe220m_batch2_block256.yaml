train:
  seed: 1337
  device: cuda
  precision: fp32
  batch_size: 2
  block_size: 256
  max_steps: 10
  max_tokens: 5120
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 5
  eval_batches: 1
  log_interval: 5
  checkpoint_interval: null
  num_workers: 0
