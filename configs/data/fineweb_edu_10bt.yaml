dataset:
  name: fineweb_edu_10bt
  source: huggingface_streaming
  hf_dataset_name: HuggingFaceFW/fineweb-edu
  hf_dataset_config_name: sample-10BT
  hf_dataset_revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  text_field: text

splits:
  source: train
  train: train
  validation: validation
  test: test

paths:
  raw_dir: data/raw/fineweb_edu_10bt
  interim_dir: data/interim/fineweb_edu_10bt
  processed_dir: data/corpus/fineweb_edu_10bt
  tokenized_dir: data/tokens/fineweb_edu_10bt

caps:
  train_examples: 50000
  validation_examples: 1000
  test_examples: 1000

streaming:
  enabled: true
  shuffle: true
  shuffle_seed: 1337
  shuffle_buffer_size: 10000
  require_explicit_caps: true

preprocessing:
  normalize_newlines: true
  strip_whitespace: true
  min_chars: 1

artifacts:
  train_text: data/corpus/fineweb_edu_10bt/train.txt
  validation_text: data/corpus/fineweb_edu_10bt/validation.txt
  test_text: data/corpus/fineweb_edu_10bt/test.txt
  train_records: data/corpus/fineweb_edu_10bt/train.records.jsonl
  validation_records: data/corpus/fineweb_edu_10bt/validation.records.jsonl
  test_records: data/corpus/fineweb_edu_10bt/test.records.jsonl
  train_token_ids: data/tokens/fineweb_edu_10bt/train.int32.bin
  validation_token_ids: data/tokens/fineweb_edu_10bt/validation.int32.bin
  test_token_ids: data/tokens/fineweb_edu_10bt/test.int32.bin
  metadata: data/corpus/fineweb_edu_10bt/metadata.json
  tokenized_metadata: data/tokens/fineweb_edu_10bt/metadata.json
