tokenizer:
  name: bpe_wikitext2
  type: byte_level_bpe
  vocab_size: 10000
  min_frequency: 2

special_tokens:
  unk_token: "<unk>"
  bos_token: "<bos>"
  eos_token: "<eos>"
  pad_token: "<pad>"

training:
  input_text_files:
    - data/processed/wikitext2/train.txt
  max_training_chars: null

artifacts:
  tokenizer_json: tokenizers/trained/bpe_wikitext2.json
  metadata_json: tokenizers/metadata/bpe_wikitext2_metadata.json
