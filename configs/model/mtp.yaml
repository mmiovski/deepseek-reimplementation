model:
  name: mtp_gpt
  vocab_size: 10000
  block_size: 128
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  dropout: 0.1
  norm_type: rmsnorm
  positional_encoding: rope
  ffn_type: swiglu
  attention_type: dense
  tie_embeddings: true
  mtp_enabled: true
  mtp_num_future_tokens: 2
  mtp_loss_weight: 0.3
  mtp_share_lm_head: false
