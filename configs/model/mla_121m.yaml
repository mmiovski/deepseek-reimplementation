model:
  name: mla_gpt
  vocab_size: 10000
  block_size: 256
  n_layers: 12
  n_heads: 12
  d_model: 768
  d_ff: 3072
  dropout: 0.1
  norm_type: rmsnorm
  positional_encoding: rope
  ffn_type: swiglu
  attention_type: mla
  tie_embeddings: true
  mla_kv_latent_dim: 192
  mla_q_rope_dim: 64
  mla_qk_nope_head_dim: 128
  mla_v_head_dim: 128
