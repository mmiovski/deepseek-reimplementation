model:
  name: v3_routing_gpt
  vocab_size: 10000
  block_size: 128
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  dropout: 0.1
  norm_type: rmsnorm
  positional_encoding: rope
  ffn_type: moe
  attention_type: dense
  n_routed_experts: 8
  n_shared_experts: 1
  moe_top_k: 2
  moe_expert_d_ff: 256
  moe_router_score: softmax
  moe_normalize_top_k_weights: true
  moe_aux_loss_weight: 0.0
  moe_drop_tokens: false
  moe_routing_mode: aux_loss_free_bias
  moe_use_expert_bias: true
  moe_expert_bias_update_rate: 0.001
  moe_expert_bias_update_interval: 1
  moe_expert_bias_min: -1.0
  moe_expert_bias_max: 1.0
  tie_embeddings: true
