model:
  name: moe_220m
  vocab_size: 10000
  block_size: 256
  n_layers: 12
  n_heads: 12
  d_model: 768
  d_ff: 3072
  dropout: 0.1
  norm_type: rmsnorm
  positional_encoding: rope
  ffn_type: moe
  attention_type: dense
  n_routed_experts: 12
  n_shared_experts: 1
  moe_top_k: 2
  moe_expert_d_ff: 512
  moe_router_score: softmax
  moe_normalize_top_k_weights: true
  moe_aux_loss_weight: 0.01
  moe_drop_tokens: false
  moe_routing_mode: aux_loss
  moe_use_expert_bias: false
  moe_expert_bias_update_rate: 0.0
  moe_expert_bias_update_interval: 1
  moe_expert_bias_min: -1.0
  moe_expert_bias_max: 1.0
  tie_embeddings: true
